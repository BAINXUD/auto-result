name: Data Collector Bot

on:
  schedule:
    - cron: '*/1 * * * *' # প্রতি ১ মিনিট পর পর চলবে (GitHub-এর সর্বনিম্ন লিমিট)
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install axios

      - name: Run collector script
        run: node script.js
        
